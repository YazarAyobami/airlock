[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.0.1"
description = "Scan Stellar and Soroban repositories for supply-chain compromise and release-integrity gaps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "posture-sec" }]
keywords = ["security", "supply-chain", "stellar", "soroban", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.scripts]
airlock = "airlock.cli:main"

[project.urls]
Repository = "https://github.com/posture-sec/airlock"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

# The scanner reads its rules at start-up, so a wheel without `rules/` cannot scan at all: it
# fails with a missing-file error and exits 2 (5.7). The data is bundled inside the package and
# `cli.rules_root` prefers that copy when it is there.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "airlock/rules"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is the package under test; `.` lets the suite import its own fixture builders.
pythonpath = ["src", "."]
# A marker typed with the wrong name only warns: pytest registers it at run time, prints nothing a
# reader acts on, and runs the test anyway, so `-m slow_tst` quietly selects nothing. Strict markers
# make that a collection error instead. (issue #91)
addopts = ["--strict-markers"]
# The suite is warning-free on the interpreters CI runs, so a new one is a failure to fix rather than
# a line to scroll past. That matters most for `DeprecationWarning`: the package declares 3.11 to
# 3.13 in one sentence and the matrix only proves the removal once it has happened.
# Every entry after `error` is an exemption, and an exemption is an `ignore:` pattern on its own line
# with a comment above it naming the module and why the call site cannot be fixed here.
# `tests/unit/test_pytest_config.py` enforces that shape. (issue #91)
filterwarnings = [
    "error",
]
markers = [
  "perf: file-count scale measurement, gated on AIRLOCK_PERF=1 (issue #88).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff format also rewrites Python fences inside Markdown. The design documents are prose
# the roadmap rules require to stay reviewable, so they are out of scope for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
